name: flapverse_3d
description: A new Flutter game project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  flame: ^1.38.0
  flame_audio: ^2.12.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  video_player: ^2.14.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    - family: Chakra Petch
      fonts:
        - asset: assets/Font/chakra-petch/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/Font/chakra-petch/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/Font/chakra-petch/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/Font/chakra-petch/ChakraPetch-Bold.ttf
          weight: 700
  assets:
    - assets/
    - assets/Characters/
    - assets/Cyber_city/
    - assets/Font/
    - assets/Icons/
    - assets/Metro_city/
    - assets/MysticForest_world_assets/
    - assets/Ocean_Realm/
    - assets/Profile_and_frames/
    - assets/sound_and_music/
    - assets/SpaceOdyssey/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Flapverse 3d Logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#051A3A"
  image: "assets/Flapverse 3d Logo.png"
  android: true
  ios: true
