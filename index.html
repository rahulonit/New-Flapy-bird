<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071936" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ui-fixes.css" />
  <title>Flapverse: Neon Flight</title>
</head>
<body>
  <div id="rotate"><div class="rotate-phone">↻</div><h1>Rotate to landscape</h1><p>Flapverse is built for two-handed landscape play.</p></div>
  <main id="app">
    <section id="home" class="screen active">
      <video id="homeBackground" class="home-video" muted playsinline loop preload="auto" poster="assets/Metro_city/MetroCity-poster.jpg" aria-hidden="true">
        <source src="assets/Metro_city/MetroCity-pingpong.mp4" type="video/mp4" />
      </video>
      <div class="home-shade"></div>
      <div class="ambient-particles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <header class="topbar">
        <button class="profile panel" data-open="characters"><span class="avatar home-avatar"></span><span><b>PLAYER ONE</b><small>LEVEL 15 · SKY PILOT</small></span></button>
        <div class="wallet"><span class="panel currency-pill">🪙 <b data-coins>0</b><button data-open="shop" aria-label="Open coin shop">+</button></span><span class="panel currency-pill">💎 <b data-gems>0</b><button data-open="shop" aria-label="Open gem shop">+</button></span><button class="icon panel" data-open="settings" aria-label="Settings">⚙</button></div>
      </header>
      <nav class="side-nav panel">
        <small class="nav-label">FLIGHT DECK</small>
        <button data-open="missions"><b class="nav-icon">✓</b><span>Missions</span><i>3</i></button>
        <button data-open="characters"><b class="nav-icon">◆</b><span>Characters</span></button>
        <button data-open="worlds"><b class="nav-icon">◎</b><span>Worlds</span></button>
        <button data-open="shop"><b class="nav-icon">◇</b><span>Hangar Shop</span></button>
        <button data-open="leaderboard"><b class="nav-icon">♛</b><span>Leaderboard</span></button>
      </nav>
      <div class="hero">
        <div class="logo asset-logo final-logo" aria-label="Flapverse 3D"></div>
        <div class="hero-bird asset-bird"></div>
        <div class="world-status"><span>ACTIVE WORLD</span><b id="homeWorldName">METRO CITY</b></div>
        <button id="playBtn" class="play"><small>START FLIGHT</small><b>PLAY</b><span>▶</span></button>
      </div>
      <button class="daily panel" data-daily><i class="notification">1</i><span class="chest asset-coin-chest"></span><b>DAILY REWARD</b><small>Tap to claim</small></button>
    </section>

    <section id="game" class="screen">
      <canvas id="gameCanvas"></canvas>
      <div class="hud top-left panel"><span>🏆</span><b id="score">0</b><small>BEST: <em id="best">0</em></small></div>
      <div id="combo" class="combo"><small>COMBO</small><b>0</b><em>PERFECT!</em></div>
      <div id="readyCountdown" class="ready-countdown">READY</div>
      <div class="hud top-right"><span class="panel">🪙 <b id="runCoins">0</b></span><button id="pauseBtn" class="icon panel">Ⅱ</button></div>
      <div class="hud bottom-left panel"><span>⚡</span><b id="distance">0m</b><small>FLY 2,000m</small></div>
      <div id="bossWarning" class="boss-warning">⚠ PORTAL SURGE</div>
      <div class="hint" id="hint">TAP TO FLAP • SWIPE TO CHANGE LANE</div>
      <div id="paused" class="modal hidden"><div class="modal-card panel"><h2>PAUSED</h2><button id="resumeBtn" class="primary">RESUME</button><button data-home>HOME</button></div></div>
    </section>

    <section id="gameover" class="screen overlay-screen">
      <div class="gameover-card panel"><h1>GAME OVER</h1><div class="gameover-body"><div class="result"><small>SCORE</small><b id="finalScore">0</b><em id="newBest">NEW BEST!</em></div><div class="crashed-bird asset-gameover"></div></div><div class="reward">REWARD <b>🪙 <span id="rewardCoins">0</span></b><b>💎 <span id="rewardGems">0</span></b></div><div class="actions"><button data-home>⌂ HOME</button><button id="retryBtn" class="primary">↻ RETRY</button><button id="adBtn" class="ad-button">CLAIM BONUS <small>×2 REWARD</small></button></div></div>
    </section>

    <section id="panelScreen" class="screen menu-screen">
      <header><button class="back" aria-label="Back">←</button><h1 id="panelTitle">WORLD SELECT</h1><div id="panelCurrency" class="header-currency"></div></header>
      <div id="panelContent" class="panel-content"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
