workflows:
  android-debug:
    name: Flapverse Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: "22"
      java: 17
      vars:
        PACKAGE_NAME: "com.flapverse.neonflight"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install JavaScript dependencies
        script: npm install

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www
          cp index.html app.js styles.css ui-fixes.css sw.js manifest.webmanifest www/
          cp -R assets www/assets

      - name: Sync Capacitor Android project
        script: npx cap sync android

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Create Gradle wrapper
        script: |
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Run Android unit tests
        script: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/tests/**/*.html

  ios-debug:
    name: Flapverse iOS Debug
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: "22"
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.flapverse.neonflight"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install JavaScript dependencies
        script: npm install

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www
          cp index.html app.js styles.css ui-fixes.css sw.js manifest.webmanifest www/
          cp -R assets www/assets

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS app as ZIP
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphoneos" \
            -maxdepth 1 -type d -name '*.app' | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No iOS .app bundle was produced."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$CM_BUILD_DIR/build/ios/Flapverse-iOS.zip"

          test -s "$CM_BUILD_DIR/build/ios/Flapverse-iOS.zip"

    artifacts:
      - build/ios/Flapverse-iOS.zip
      - build/ios/Build/Products/**/*.app
      - build/ios/Build/Products/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
