workflows:
  android-debug:
    name: Flapverse Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: "22"
      java: 17
      vars:
        PACKAGE_NAME: "com.flapverse.neonflight"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install JavaScript dependencies
        script: npm install

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www
          cp index.html app.js styles.css ui-fixes.css sw.js manifest.webmanifest www/
          cp -R assets www/assets

      - name: Sync Capacitor Android project
        script: npx cap sync android

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Create Gradle wrapper
        script: |
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Run Android unit tests
        script: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/tests/**/*.html
